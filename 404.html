<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plate 404 — this print never developed.">
  <title>Pl. 404 · Not Exposed</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="stylesheet" href="/fonts/cyanotype-fonts.css">
  <link rel="stylesheet" href="/css/cyanotype.css">
  <script>
    (function () {
      const raw = localStorage.getItem('theme');
      let theme = 'paper';
      if (raw === 'paper' || raw === 'night') theme = raw;
      else if (raw === 'dark')  { theme = 'night'; localStorage.setItem('theme', 'night'); }
      else if (raw === 'light') { theme = 'paper'; localStorage.setItem('theme', 'paper'); }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    html, body { height: 100%; }
    body {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .topbar { gap: var(--sp-4); letter-spacing: 0.28em; }
    .topbar .brand { display: inline-flex; align-items: center; gap: 10px; }
    .topbar .brand .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(107, 157, 199, 0.18);
    }
    .topbar .brand a { color: var(--fg-mute); text-decoration: none; transition: color var(--t-fast) ease; }
    .topbar .brand a:hover { color: var(--fg); }

    .icon-btn .moon { display: none; }
    [data-theme="night"] .icon-btn .sun  { display: none; }
    [data-theme="night"] .icon-btn .moon { display: block; }

    .stage {
      flex: 1;
      display: grid;
      place-items: center;
      padding: var(--sp-5) var(--sp-8) var(--sp-10);
    }

    .plate-404 {
      position: relative;
      background: var(--plate-bg);
      color: var(--plate-fg);
      border: 1px solid var(--line);
      box-shadow: var(--plate-shadow);
      width: min(560px, 92vw);
      padding: var(--sp-14) var(--sp-14) 44px;
      overflow: hidden;
      transform: rotate(-0.4deg);
      animation: rise-404 900ms var(--ease) forwards;
      opacity: 0;
    }
    @keyframes rise-404 {
      from { opacity: 0; transform: rotate(-0.4deg) translateY(14px); }
      to   { opacity: 1; transform: rotate(-0.4deg) translateY(0); }
    }

    .plate-404::after {
      content: "";
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.9  0 0 0 0 0.93  0 0 0 0 0.84  0 0 0 0.4 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      opacity: 0.10;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .plate-404 .corner {
      position: absolute; width: 16px; height: 16px;
      border: 1px solid var(--plate-rule);
      pointer-events: none;
    }
    .plate-404 .corner.tl { top: 10px;    left: 10px;    border-right: none; border-bottom: none; }
    .plate-404 .corner.tr { top: 10px;    right: 10px;   border-left: none;  border-bottom: none; }
    .plate-404 .corner.bl { bottom: 10px; left: 10px;    border-right: none; border-top: none; }
    .plate-404 .corner.br { bottom: 10px; right: 10px;   border-left: none;  border-top: none; }

    .plate-404 .plate-id {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: var(--text-sm);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--plate-id-fg);
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 22px;
      position: relative; z-index: 1;
    }
    .plate-404 .plate-id::after { content: ""; flex: 1; height: 1px; background: var(--plate-rule); }

    .plate-title {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(56px, 8vw, 88px);
      line-height: 0.95;
      letter-spacing: -0.025em;
      margin-bottom: 18px;
      position: relative; z-index: 1;
    }

    .plate-body {
      font-family: 'Fraunces', serif;
      font-size: 17px;
      line-height: 1.7;
      color: var(--fg-mute);
      max-width: 42ch;
      padding-top: 18px;
      border-top: 1px solid var(--plate-rule);
      margin-bottom: var(--sp-8);
      position: relative; z-index: 1;
    }
    .plate-body em { font-style: italic; color: var(--fg); }

    .plate-actions {
      display: flex; gap: var(--sp-3); flex-wrap: wrap;
      position: relative; z-index: 1;
    }
    .plate-404 .btn {
      color: var(--plate-fg);
      border-color: var(--plate-rule);
    }
    .plate-404 .btn:hover {
      background: var(--plate-fg);
      color: var(--plate-bg);
      border-color: var(--plate-fg);
    }
    .plate-404 .btn .glyph { font-size: 13px; letter-spacing: 0; line-height: 1; }

    .plate-stamp {
      position: absolute;
      right: 26px; bottom: 22px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--text-2xs);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--plate-id-fg);
      border: 1px solid var(--plate-rule);
      padding: var(--sp-1) var(--sp-2);
      transform: rotate(4deg);
      z-index: 1;
    }

    .print-stamp { padding: 18px var(--sp-8); margin-top: 0; }

    .botanical { opacity: 0.16; }
    .botanical.left  { top: -50px; left: -70px; width: 360px; height: 500px; transform: rotate(-14deg); }
    .botanical.right { bottom: -90px; right: -90px; width: 440px; height: 580px; transform: rotate(10deg) scaleX(-1); }

    @media (max-width: 720px) {
      body { overflow: auto; }
      .topbar { padding: var(--sp-4) 22px; }
      .stage  { padding: var(--sp-4) 22px var(--sp-8); }
      .plate-404 { padding: var(--sp-10) var(--sp-7) 36px; }
      .plate-stamp { right: 14px; bottom: 12px; }
      .botanical.left  { width: 220px; height: 300px; opacity: 0.10; }
      .botanical.right { width: 260px; height: 340px; opacity: 0.10; }
      .print-stamp { padding: 14px 22px; font-size: var(--text-2xs); }
    }
    @media (max-height: 620px) {
      body { overflow: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      .plate-404 { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="botanical left" aria-hidden="true">
    <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 280 C 100 220, 70 180, 40 160 C 70 165, 90 150, 95 130 C 70 130, 50 110, 35 85 C 60 95, 85 90, 95 70 C 75 65, 60 45, 50 20 C 75 35, 95 35, 100 10 C 105 35, 125 35, 150 20 C 140 45, 125 65, 105 70 C 115 90, 140 95, 165 85 C 150 110, 130 130, 105 130 C 110 150, 130 165, 160 160 C 130 180, 100 220, 100 280 Z"/>
    </svg>
  </div>
  <div class="botanical right" aria-hidden="true">
    <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 280 C 100 230, 60 210, 30 200 C 60 195, 95 180, 100 150 C 70 150, 40 135, 20 110 C 50 115, 85 110, 100 85 C 80 75, 60 55, 55 25 C 80 45, 95 50, 100 25 C 105 50, 120 45, 145 25 C 140 55, 120 75, 100 85 C 115 110, 150 115, 180 110 C 160 135, 130 150, 100 150 C 105 180, 140 195, 170 200 C 140 210, 100 230, 100 280 Z"/>
    </svg>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <a href="/">Ethan Nguyen · Folio</a>
    </div>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme">
      <span class="sun"  aria-hidden="true">☀</span>
      <span class="moon" aria-hidden="true">☾</span>
    </button>
  </header>

  <main class="stage">
    <article class="plate-404" aria-labelledby="plate-title">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>

      <div class="plate-id">Plate 404 — Specimen lost in transit</div>

      <h1 class="plate-title" id="plate-title">Not<br><em>Exposed.</em></h1>

      <p class="plate-body">
        This print never developed. The page you were looking for isn't in
        this folio — it may have been <em>moved</em>, <em>renamed</em>, or
        never exposed to light at all.
      </p>

      <div class="plate-actions">
        <a class="btn" href="/">
          <span class="glyph" aria-hidden="true">←</span> Back to Folio I
        </a>
        <button class="btn" type="button" onclick="window.history.back()">
          <span class="glyph" aria-hidden="true">↩</span> Previous Plate
        </button>
      </div>

      <span class="plate-stamp" aria-hidden="true">Ø&nbsp;exposed</span>
    </article>
  </main>

  <footer class="print-stamp">
    <div class="seal">Exposed in cyan, <span id="year"></span></div>
    <span>Pl. 404 · Not Exposed</span>
    <a href="mailto:phatnguyenground@gmail.com">email me</a>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      const cur  = document.documentElement.getAttribute('data-theme');
      const next = cur === 'night' ? 'paper' : 'night';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  </script>
</body>
</html>
